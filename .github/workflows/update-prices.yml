name: Update prices

on:
  schedule:
    - cron: "0 22 * * 1-5" # 22:00 UTC, lun-ven (dopo la chiusura del mercato USA)
  workflow_dispatch: {} # permette di lanciarlo a mano dalla tab Actions

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # serve per committare il JSON aggiornato
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install yfinance pandas lxml

      - name: Scarica i prezzi
        run: python ml/download_sample.py # deve scrivere data/prices.json

      - name: Commit del JSON aggiornato
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git add data/prices.json
          git commit -m "update prices $(date -u +%F)" || echo "nessuna modifica"
          git push
